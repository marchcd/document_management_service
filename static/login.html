<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — КАИ</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Golos+Text:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f5f7fa;
            --surface: #ffffff;
            --border: #e2e8f0;
            --accent: #2563eb;
            --accent-glow: rgba(37, 99, 235, 0.1);
            --text: #0f172a;
            --muted: #64748b;
            --danger: #dc2626;
            --danger-glow: rgba(220, 38, 38, 0.08);
        }

        body {
            font-family: 'Golos Text', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(37, 99, 235, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(37, 99, 235, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            position: relative;
            z-index: 1;
        }

        .logo-tag {
            font-family: 'Unbounded', sans-serif;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-tag::before {
            content: '';
            display: inline-block;
            width: 16px;
            height: 2px;
            background: var(--accent);
        }

        h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 28px;
            line-height: 1.2;
        }

        .error {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--danger-glow);
            border: 1px solid rgba(220, 38, 38, 0.2);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            color: var(--danger);
            margin-bottom: 20px;
        }

        .error svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 20px;
        }

        label {
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
        }

        input[type="password"] {
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 9px;
            padding: 11px 14px;
            font-family: 'Golos Text', sans-serif;
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
            width: 100%;
        }

        input[type="password"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        button[type="submit"] {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 9px;
            padding: 13px;
            font-family: 'Unbounded', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
        }

        button[type="submit"]:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo-tag">КНИТУ-КАИ · Альметьевский филиал</div>
        <h1>Панель управления</h1>

        <!-- Показываем ошибку если ?error=1 -->
        <div class="error" id="errorBlock" style="display:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            Неверный пароль
        </div>

        <form method="POST" action="/login">
            <!-- Передаём ?next обратно на сервер -->
            <input type="hidden" name="next" id="nextInput">
            <div class="field">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="••••••••" autofocus
                    autocomplete="current-password">
            </div>
            <button type="submit">Войти</button>
        </form>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('error')) {
            document.getElementById('errorBlock').style.display = 'flex';
        }
        document.getElementById('nextInput').value = params.get('next') || '';
    </script>
</body>

</html>
