services:
  db:
    image: postgres:15-alpine
    container_name: kai_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  browser:
    image: zenika/alpine-chrome:latest
    container_name: kai_chrome
    command: chromium-browser --headless --no-sandbox --remote-debugging-address=0.0.0.0 --remote-debugging-port=9222
    ports:
      - "9222:9222"
    volumes:
      - ./fonts:/usr/share/fonts/msttcorefonts

  migrations:
    image: gomicro/goose
    container_name: kai_migrations
    volumes:
      - ./migrations:/migrations
    command: goose -dir /migrations postgres "host=db user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} sslmode=disable" up
    #migrations:
    #image: gomicro/goose
    #container_name: kai_migrations
    #volumes:
    #  - ./migrations:/migrations
    # Мы меняем команду на скрипт, который ждет открытия порта 5432
    #entrypoint: >
    #  sh -c "
    #  echo 'Waiting for database...';
    #  until nc -z db 5432; do
    #    sleep 1;
    #  done;
    #  echo 'Database is up - executing migrations';
    # goose -dir /migrations postgres \"host=db user=user password=password dbname=kai_db sslmode=disable\" up
    #  "
    depends_on:
      db:
        condition: service_healthy
  
  app:
    build: .
    container_name: kai_app
    ports:
      - "8080:8080"
    environment:
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - CHROME_URL=ws://browser:9222
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ./data/sessions.json:/root/static/sessions.json
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
volumes:
  postgres_data: